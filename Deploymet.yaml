apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp
  namespace: webapps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: bankapp
        image: saikumar0803
      resources:
        requests:
          cpu: '250m'
          memory: '256Mi'
        limits:
          cpu: '500m'
          memory: '512Mi'
      ports:
      - containerPort: 8080
      env:
      - name: SPRING_DATASOURCE_URL
        value: jdbc:mysql://mysql-svc:3306/bankapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - name: SPRING_DATASOURCE_USERNAME
        value: root
      - name: SPRING_DATASOURCE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mysql-secret
            value: MYSQL_ROOT_PASSWORD
      livenessProbe:
        httpGet:
          path: /login
          port: 8080
        initialDelaySeconds: 60
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /login
          port: 8080
        initialDelaySeconds: 60
        timeoutSeconds: 10
        periodSeconds: 10
        failureThreshold: 3
